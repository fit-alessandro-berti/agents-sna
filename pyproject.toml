[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-sna"
version = "0.1.0"
description = "A small OpenRouter-backed multi-agent LLM discussion orchestrator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
agents-sna = "agents_sna.cli:main"
agents-sna-benchmark = "agents_sna.benchmark_runner:main"

[tool.setuptools.packages.find]
where = ["src"]
